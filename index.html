<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活動快速報到系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QR Code / Barcode 掃描器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 dark:from-slate-900 dark:to-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- 頂部大標題 -->
    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight mt-4 mb-3 text-center bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
        富友開發說明會快速報到系統
    </h1>

    <!-- 固定統計區塊 -->
    <div class="w-full max-w-xl bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border border-blue-100 dark:border-slate-700 rounded-2xl p-5 mb-4 shadow-xl shadow-blue-500/5 text-center">
        <div id="stats-label" class="text-2xl md:text-3xl font-black text-blue-900 dark:text-blue-300 tracking-wide">
            已報到人數：載入中…
        </div>
    </div>

    <!-- 相機掃描控制按鈕區 -->
    <div id="camera-control-container" class="w-full max-w-xl mb-4">
        <button id="toggle-camera-btn" class="w-full h-14 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold rounded-2xl transition shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2 text-lg">
            📷 <span>開啟相機掃描條碼</span>
        </button>
        <!-- 相機即時預覽框 (預設隱藏) -->
        <div id="reader-container" class="w-full bg-black rounded-2xl overflow-hidden mt-3 shadow-inner hidden relative">
            <div id="reader"></div>
            <button id="close-camera-btn" class="absolute top-3 right-3 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md z-10">
                關閉鏡頭
            </button>
        </div>
    </div>

    <!-- 輸入與按鈕操作區 -->
    <div id="input-frame" class="w-full max-w-xl bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl p-4 mb-4 shadow-xl shadow-slate-200 dark:shadow-none border border-slate-200/80 dark:border-slate-700">
        <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 text-center mb-2.5">
            掃描機掃描條碼可直接完成報到，或手動輸入編號/姓名
        </p>
        <div class="flex gap-2 items-center justify-center">
            <input type="text" id="barcode-input" placeholder="請輸入編號或姓名…" autocomplete="off"
                class="w-48 sm:w-64 h-11 px-3 text-base font-mono text-center bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-inner">
            <button id="execute-btn" class="h-11 px-5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-md text-sm md:text-base">
                報到
            </button>
        </div>
    </div>

    <!-- 功能列 -->
    <div id="toolbar-frame" class="w-full max-w-xl flex gap-3 mb-4">
        <button id="view-absent-btn" class="flex-1 h-12 bg-sky-50 hover:bg-sky-100 dark:bg-sky-950/60 dark:hover:bg-sky-900/80 text-rose-600 dark:text-rose-400 font-bold rounded-xl transition shadow-sm border border-sky-200/60 dark:border-sky-900">
            查看未報到清單
        </button>
    </div>

    <!-- 狀態顯示與結果區塊 -->
    <div id="status-frame" class="w-full max-w-xl bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl p-6 mb-4 shadow-xl shadow-slate-200 dark:shadow-none text-center flex flex-col items-center justify-center min-h-[220px] transition-all border border-slate-200/80 dark:border-slate-700">
        <div id="status-title" class="text-2xl md:text-3xl font-extrabold mb-3 text-slate-700 dark:text-slate-200">
            等待掃描或輸入…
        </div>
        <div id="info-label" class="text-lg md:text-xl text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed">
            請進行報到作業
        </div>
        <div id="smiley-container" class="mt-4"></div>
    </div>

    <!-- 姓名候選清單畫面 -->
    <div id="candidates-frame" class="w-full max-w-xl bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl p-5 mb-4 shadow-xl max-h-[380px] overflow-y-auto border border-slate-200 dark:border-slate-700" style="display:none;">
        <div id="candidates-title" class="font-bold text-center mb-3 text-slate-700 dark:text-slate-200"></div>
        <div id="candidates-list" class="flex flex-col gap-2"></div>
        <button id="cancel-search-btn" class="w-full mt-3 h-12 bg-slate-500 hover:bg-slate-600 text-white rounded-xl font-bold transition">
            取消，重新輸入
        </button>
    </div>

    <!-- 未報到清單畫面 -->
    <div id="absent-view-container" class="w-full max-w-xl flex flex-col flex-1" style="display:none;">
        <button id="back-to-checkin-btn" class="w-full h-12 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl mb-4 shadow-lg shadow-blue-600/25 transition">
            返回報到系統
        </button>
        <div class="w-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl p-5 flex-1 shadow-xl max-h-[500px] overflow-y-auto border border-slate-200 dark:border-slate-700">
            <div id="absent-count-label" class="text-xl font-bold text-center mb-4 text-slate-700 dark:text-slate-200"></div>
            <div id="absent-list-content" class="grid grid-cols-2 gap-3 text-center"></div>
        </div>
    </div>

<script>
    // ---------------- GAS Web App 網址設定 ----------------
    // 與 Python 版本使用同一個 GAS 網址，資料來源是同一份雲端 Google Sheet「報到表」
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwq3aK8bCYD_p-zKEmfp-UXKZyguwF5_pdwtxiofGs1La1TrzDhQ90VpmWgDbcHr9Ly/exec";

    let totalCount = 0;
    let checkedInCount = 0;
    let html5QrCode = null;
    let isCameraRunning = false;

    // 掃描槍/手動輸入的緩衝區，不依賴輸入框是否有焦點，
    // 只要這個分頁是瀏覽器目前作用中的分頁，就能接收鍵盤輸入。
    let scanBuffer = "";
    let isAbsentView = false;

    const barcodeInput = document.getElementById('barcode-input');
    const executeBtn = document.getElementById('execute-btn');
    const statsLabel = document.getElementById('stats-label');
    const statusFrame = document.getElementById('status-frame');
    const statusTitle = document.getElementById('status-title');
    const infoLabel = document.getElementById('info-label');
    const smileyContainer = document.getElementById('smiley-container');
    const cameraControlContainer = document.getElementById('camera-control-container');
    const toggleCameraBtn = document.getElementById('toggle-camera-btn');
    const readerContainer = document.getElementById('reader-container');
    const closeCameraBtn = document.getElementById('close-camera-btn');

    const viewAbsentBtn = document.getElementById('view-absent-btn');
    const backToCheckinBtn = document.getElementById('back-to-checkin-btn');
    const absentViewContainer = document.getElementById('absent-view-container');
    const inputFrame = document.getElementById('input-frame');
    const toolbarFrame = document.getElementById('toolbar-frame');
    const absentCountLabel = document.getElementById('absent-count-label');
    const absentListContent = document.getElementById('absent-list-content');

    const candidatesFrame = document.getElementById('candidates-frame');
    const candidatesTitle = document.getElementById('candidates-title');
    const candidatesList = document.getElementById('candidates-list');
    const cancelSearchBtn = document.getElementById('cancel-search-btn');

    const THEMES = {
        success: { bg: 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-900', titleColor: 'text-emerald-700 dark:text-emerald-300' },
        duplicate: { bg: 'bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-900', titleColor: 'text-amber-700 dark:text-amber-300' },
        error: { bg: 'bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-900', titleColor: 'text-rose-700 dark:text-rose-300' },
        neutral: { bg: 'bg-white/90 dark:bg-slate-800/90 border-slate-200 dark:border-slate-700', titleColor: 'text-slate-700 dark:text-slate-200' }
    };

    // ==================== 呼叫 GAS 共用函式 ====================
    // silent = true 時（例如背景定期輪詢），失敗不跳出錯誤訊息，避免干擾畫面，靜默略過即可。
    async function callGas(action, params = {}, silent = false) {
        const query = new URLSearchParams({ action, ...params });
        try {
            const resp = await fetch(`${GAS_URL}?${query.toString()}`);
            const data = await resp.json();
            if (!data.ok) {
                if (!silent) showStatus("❌ 雲端回應錯誤", data.error || "未知錯誤", 'error');
                return null;
            }
            return data;
        } catch (err) {
            if (!silent) showStatus("❌ 網路錯誤", `無法連線到雲端服務，請檢查網路連線後再試一次。\n${err.message}`, 'error');
            return null;
        }
    }

    // ==================== 頁面載入時，自動抓取雲端統計 ====================
    window.addEventListener('DOMContentLoaded', loadInitialStats);

    async function loadInitialStats() {
        const data = await callGas('stats');
        if (!data) return;
        totalCount = data.total;
        checkedInCount = data.checked_in;
        updateStatsDisplay();
    }

    // ==================== 定期自動輪詢，讓沒有在操作的裝置也能自動同步 ====================
    // 例如筆電報到後，手機這邊不用手動整理，幾秒內畫面會自動更新最新人數。
    // 注意：這是「每隔幾秒問一次雲端」，不是毫秒級即時推播，會有幾秒的些微延遲。
    const STATS_POLL_INTERVAL_MS = 5000;

    async function refreshStats() {
        if (isAbsentView) return; // 在未報到清單畫面時，暫不干擾，避免畫面被打斷
        const data = await callGas('stats', {}, true);
        if (!data) return; // 輪詢失敗（例如網路暫時不穩）就靜默略過，下一輪再試
        totalCount = data.total;
        checkedInCount = data.checked_in;
        updateStatsDisplay();
    }

    setInterval(refreshStats, STATS_POLL_INTERVAL_MS);

    // 分頁從背景切回前景時（例如切去別的視窗又切回來），立刻刷新一次，
    // 不用等到下一輪 5 秒輪詢，讓兩台裝置的同步感覺更即時。
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            refreshStats();
        }
    });

    function updateStatsDisplay() {
        statsLabel.innerText = `已報到人數：${checkedInCount} / ${totalCount}`;
    }

    // ==================== 全網頁鍵盤監聽（掃描槍 = 快速鍵盤輸入） ====================
    // 綁在整個網頁（document）上，不論滑鼠點在畫面哪個位置，
    // 只要這個分頁是目前作用中的分頁，就能接收掃描槍打出來的字元。
    // 輸入框本身設為 readonly，只作為「目前輸入內容」的顯示用途。
    barcodeInput.setAttribute('readonly', 'readonly');

    // ==================== 自動維持輸入框焦點 ====================
    // 目的：筆電使用實體/藍牙掃描槍時，掃描槍其實是用「模擬鍵盤輸入」的方式運作。
    // 瀏覽器要能收到這些按鍵事件，頁面本身必須要有作用中的焦點（focus），
    // 否則就算監聽器綁在 document 上也可能收不到。
    // 以下機制讓輸入框「隨時自動保持在被選取狀態」，使用者完全不需要手動點擊，
    // 掃描槍掃描後就能直接寫入 Google Sheet，跟手機相機掃描一樣「隨掃即用」。
    // 偵測是否為觸控裝置（例如 iPhone / iPad）。
    // 觸控裝置維持「使用者點一下才聚焦、才彈出螢幕鍵盤」的原生行為；
    // 只有非觸控裝置（例如筆電，操作方式是滑鼠 + 實體鍵盤/掃描槍）才啟用自動搶焦點機制。
    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);

    function keepFocus() {
        if (isTouchDevice) return; // 觸控裝置不強制搶焦點，避免螢幕鍵盤無法正常彈出
        if (isAbsentView) return; // 在未報到清單畫面時不搶焦點，避免影響瀏覽
        if (document.activeElement !== barcodeInput) {
            barcodeInput.focus();
        }
    }

    if (!isTouchDevice) {
        // 頁面載入完成，先聚焦一次
        window.addEventListener('load', () => barcodeInput.focus());

        // 輸入框一旦失去焦點，極短時間內自動搶回來
        barcodeInput.addEventListener('blur', () => {
            setTimeout(keepFocus, 50);
        });

        // 保險機制：每 0.3 秒檢查一次，確保長時間使用焦點不會悄悄跑掉
        setInterval(keepFocus, 300);

        // 使用者點擊畫面空白處時，也自動把焦點帶回輸入框
        // （但點擊按鈕、候選清單等互動元件時不搶，避免影響原本的點擊功能）
        document.addEventListener('click', (e) => {
            if (e.target.closest('button') || e.target.closest('#candidates-list')) return;
            setTimeout(keepFocus, 50);
        });
    }

    document.addEventListener('keydown', (e) => {
        if (isAbsentView) return; // 未報到清單畫面時，暫不處理輸入，避免誤觸報到

        if (e.key === 'Enter') {
            handleExecute();
            e.preventDefault();
            return;
        }

        if (e.key === 'Backspace') {
            scanBuffer = scanBuffer.slice(0, -1);
            barcodeInput.value = scanBuffer;
            e.preventDefault();
            return;
        }

        // 忽略 Shift、Ctrl、方向鍵等非字元按鍵（e.key.length === 1 代表是單一可印字元）
        if (e.key.length === 1) {
            scanBuffer += e.key;
            barcodeInput.value = scanBuffer;
        }
    });

    function handleExecute() {
        const text = scanBuffer.trim();
        if (!text) return;

        if (/^\d+$/.test(text)) {
            checkinByCode(text);
        } else {
            searchByName(text);
        }

        scanBuffer = "";
        barcodeInput.value = "";
    }

    // 「報到」按鈕保留，作為備用觸發方式（滑鼠點擊時，處理目前緩衝區內容）
    executeBtn.addEventListener('click', handleExecute);

    // ==================== 依編號報到 ====================
    async function checkinByCode(code) {
        const data = await callGas('checkin', { code });
        if (!data) return;

        // 直接採用雲端回傳的最新真實數字，不自己 +1，
        // 這樣不管幾台裝置同時操作，顯示的都是雲端當下的真實狀態。
        if (typeof data.total === 'number' && typeof data.checked_in === 'number') {
            totalCount = data.total;
            checkedInCount = data.checked_in;
            updateStatsDisplay();
        }

        if (data.status === 'success') {
            showStatus("✅ 報到成功！", `編 號： ${data.code}\n\n姓 名： ${data.name}\n\n報到時間： ${data.time}`, 'success');
            if (data.show_smiley) renderSmiley();
        } else if (data.status === 'duplicate') {
            showStatus("⚠️ 注意：此貴賓已重複報到！", `編 號： ${data.code}\n\n姓 名： ${data.name}\n\n原報到時間： ${data.time}`, 'duplicate');
        } else {
            showStatus("❌ 查無此編號", `代號「${code}」不在名單中，請重新確認！`, 'error');
        }
    }

    // ==================== 姓名模糊查詢 ====================
    async function searchByName(keyword) {
        const data = await callGas('search_name', { keyword });
        if (!data) return;

        const matches = data.matches || [];
        if (matches.length === 0) {
            hideCandidates();
            showStatus("❌ 查無此姓名", `找不到姓名包含「${keyword}」的貴賓，請重新確認！`, 'error');
        } else {
            showCandidates(keyword, matches);
        }
    }

    function showCandidates(keyword, matches) {
        statusFrame.style.display = 'none';
        candidatesList.innerHTML = '';
        candidatesTitle.innerText = `姓名包含「${keyword}」，共找到 ${matches.length} 筆，請點選正確的貴賓：`;

        matches.forEach(m => {
            let tag = m.checked_in ? "（已報到）" : "";
            let btn = document.createElement('button');
            btn.className = `w-full py-3 px-4 rounded-xl font-bold text-lg text-white transition shadow-sm ${m.checked_in ? 'bg-slate-500 hover:bg-slate-600' : 'bg-blue-600 hover:bg-blue-700'}`;
            btn.innerText = `編號 ${m.code} 姓名 ${m.name}${tag}`;
            btn.onclick = () => {
                hideCandidates();
                checkinByCode(m.code);
            };
            candidatesList.appendChild(btn);
        });

        candidatesFrame.style.display = 'block';
    }

    function hideCandidates() {
        candidatesFrame.style.display = 'none';
        statusFrame.style.display = 'flex';
    }

    cancelSearchBtn.onclick = hideCandidates;

    function showStatus(title, info, type) {
        smileyContainer.innerHTML = '';
        statusFrame.style.display = 'flex';
        candidatesFrame.style.display = 'none';
        statusFrame.className = `w-full max-w-xl rounded-2xl p-6 mb-4 shadow-xl text-center flex flex-col items-center justify-center min-h-[220px] transition-all border ${THEMES[type].bg}`;
        statusTitle.className = `text-2xl md:text-3xl font-extrabold mb-3 ${THEMES[type].titleColor}`;
        statusTitle.innerText = title;
        infoLabel.innerText = info;
    }

    function renderSmiley() {
        smileyContainer.innerHTML = `
            <svg width="90" height="90" viewBox="0 0 140 140" class="mx-auto drop-shadow-md">
                <circle cx="70" cy="70" r="60" fill="#FFD400" stroke="#E0A800" stroke-width="3"/>
                <circle cx="52" cy="55" r="8" fill="black"/>
                <circle cx="88" cy="55" r="8" fill="black"/>
                <path d="M 40 75 Q 70 110 100 75" fill="none" stroke="black" stroke-width="6" stroke-linecap="round"/>
            </svg>
        `;
    }

    // ==================== 相機掃描（CODE 128 一維條碼） ====================
    toggleCameraBtn.onclick = () => {
        if (!isCameraRunning) {
            startCamera();
        } else {
            stopCamera();
        }
    };

    closeCameraBtn.onclick = stopCamera;

    function startCamera() {
        readerContainer.classList.remove('hidden');
        toggleCameraBtn.querySelector('span').innerText = "關閉相機鏡頭";
        isCameraRunning = true;

        if (!html5QrCode) {
            // 指定只辨識 CODE 128 一維條碼，辨識速度更快、更準確
            html5QrCode = new Html5Qrcode("reader", {
                formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ],
                verbose: false
            });
        }

        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 10,
                // 一維條碼是長條形，掃描框改成扁長方形比較容易對準
                qrbox: { width: 280, height: 120 }
            },
            (decodedText) => {
                stopCamera();
                checkinByCode(decodedText.trim());
            },
            (errorMessage) => {}
        ).catch(err => {
            alert(`無法啟動相機鏡頭：\n${err}`);
            stopCamera();
        });
    }

    function stopCamera() {
        if (html5QrCode && isCameraRunning) {
            html5QrCode.stop().then(() => {
                readerContainer.classList.add('hidden');
                toggleCameraBtn.querySelector('span').innerText = "開啟相機掃描條碼";
                isCameraRunning = false;
            }).catch(err => {
                console.error("停止相機失敗", err);
                readerContainer.classList.add('hidden');
                isCameraRunning = false;
            });
        } else {
            readerContainer.classList.add('hidden');
            toggleCameraBtn.querySelector('span').innerText = "開啟相機掃描條碼";
            isCameraRunning = false;
        }
    }

    // ==================== 查看未報到清單 ====================
    viewAbsentBtn.onclick = () => {
        if (isCameraRunning) stopCamera();

        inputFrame.style.display = 'none';
        toolbarFrame.style.display = 'none';
        statusFrame.style.display = 'none';
        candidatesFrame.style.display = 'none';
        cameraControlContainer.style.display = 'none';
        absentViewContainer.style.display = 'flex';

        loadAbsentList();
    };

    backToCheckinBtn.onclick = () => {
        absentViewContainer.style.display = 'none';
        inputFrame.style.display = 'block';
        toolbarFrame.style.display = 'flex';
        statusFrame.style.display = 'flex';
        cameraControlContainer.style.display = 'block';
        keepFocus();
    };

    async function loadAbsentList() {
        absentListContent.innerHTML = `<div class="col-span-full py-6 text-slate-500">載入中…</div>`;

        const data = await callGas('absent_list');
        absentListContent.innerHTML = '';
        if (!data) return;

        const absentList = data.absent || [];
        absentCountLabel.innerText = `尚未報到（共 ${absentList.length} 位）`;

        if (absentList.length === 0) {
            absentListContent.innerHTML = `<div class="col-span-full py-10 text-xl font-bold text-slate-500">所有貴賓皆已報到！</div>`;
        } else {
            absentList.forEach(item => {
                let div = document.createElement('div');
                div.className = "bg-slate-50 dark:bg-slate-900 p-3.5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 text-xl md:text-2xl font-semibold tracking-wide";
                div.innerText = `${item.code} ${item.name}`;
                absentListContent.appendChild(div);
            });
        }
    }
</script>
</body>
</html>
